# Generates github-metrics.svg (the dashboard in the README) every 12 hours.
# Setup:
#   1. Create a Personal Access Token (classic) with scopes: read:org, read:user, repo
#   2. Add it to this repo: Settings > Secrets and variables > Actions > New secret
#      Name it METRICS_TOKEN
name: GitHub Metrics

on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Nairobi
          config_order: base.header, isocalendar, base.activity, habits, languages, lines, achievements, base.community, base.repositories, base.metadata

          # 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding habits: time of day, day of week, recent activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # Lines of code added/removed
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # Achievements and badges
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8

          # Optional: add your website's PageSpeed score (uncomment and set URL)
          # plugin_pagespeed: yes
          # plugin_pagespeed_url: https://your-site.com
          # plugin_pagespeed_detailed: yes